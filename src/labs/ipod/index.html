<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A first-generation iPod, redrawn in CSS. Scroll the wheel, pick a track, play local clips."
    />
    <title>iPod — Labs</title>
    <link rel="stylesheet" href="/labs/ipod/styles.css" />
  </head>
  <body>
    <aside class="desktop" aria-label="Desktop">
      <a class="desktop__icon" href="/labs/">
        <span class="desktop__glyph desktop__glyph--labs" aria-hidden="true"></span>
        <span class="desktop__label">❮ Back to Labs</span>
      </a>
      <button
        type="button"
        class="desktop__icon"
        id="btn-info"
        aria-haspopup="dialog"
        aria-controls="info-window"
      >
        <span class="desktop__glyph desktop__glyph--info" aria-hidden="true"></span>
        <span class="desktop__label">Info</span>
      </button>
    </aside>

    <main class="stage">
      <div class="ipod" role="application" aria-label="First-generation iPod">
        <div class="ipod__body">
          <div class="ipod__screen-bezel">
            <div class="ipod__lcd" aria-live="polite">
              <header class="lcd__status">
                <span class="lcd__play" id="lcd-play" aria-hidden="true">▶</span>
                <span class="lcd__title" id="lcd-title">Music</span>
                <span class="lcd__battery" aria-hidden="true"></span>
              </header>

              <section class="lcd__panel lcd__panel--list is-active" id="screen-list">
                <h2 class="lcd__heading" id="list-heading">Music</h2>
                <div class="lcd__list-wrap">
                  <ul class="lcd__list" id="song-list" role="listbox" aria-labelledby="list-heading"></ul>
                </div>
              </section>

              <section class="lcd__panel lcd__panel--now" id="screen-now">
                <h2 class="lcd__heading">Now Playing</h2>
                <p class="now__index" id="now-index" aria-hidden="true">1 of 1</p>
                <div class="now__meta">
                  <p class="now__track" id="now-title"></p>
                  <p class="now__artist" id="now-artist"></p>
                  <p class="now__album" id="now-album"></p>
                </div>
                <div class="now__progress" aria-hidden="true">
                  <div class="now__bar">
                    <div class="now__bar-fill" id="now-progress"></div>
                  </div>
                  <div class="now__times">
                    <span class="now__time" id="now-elapsed">0:00</span>
                    <span class="now__time" id="now-remaining">-0:00</span>
                  </div>
                </div>
              </section>

              <p class="lcd__note" id="lcd-note" hidden></p>
            </div>
          </div>

          <div class="ipod__wheel" id="wheel">
            <button type="button" class="wheel__btn wheel__btn--menu" id="btn-menu" aria-label="Menu">
              menu
            </button>
            <button type="button" class="wheel__btn wheel__btn--prev" id="btn-prev" aria-label="Previous">
              |&#171;
            </button>
            <button type="button" class="wheel__btn wheel__btn--next" id="btn-next" aria-label="Next">
              &#187;|
            </button>
            <button type="button" class="wheel__btn wheel__btn--play" id="btn-play" aria-label="Play or pause">
              &#9654;&#9647;&#9647;
            </button>
            <button type="button" class="wheel__center" id="btn-select" aria-label="Select"></button>
            <div class="wheel__ring" id="wheel-ring" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <p class="stage__hint">
        Drag the wheel to scroll. Center selects. Menu goes back.
      </p>
    </main>

    <dialog class="finder" id="info-window" aria-labelledby="info-title">
      <div class="finder__chrome">
        <div class="finder__titlebar">
          <div class="finder__traffic">
            <button type="button" class="finder__traffic-btn finder__traffic-btn--close" id="btn-info-close" aria-label="Close"></button>
            <span class="finder__traffic-btn finder__traffic-btn--minimize" aria-hidden="true"></span>
            <span class="finder__traffic-btn finder__traffic-btn--zoom" aria-hidden="true"></span>
          </div>
          <h2 class="finder__title" id="info-title">Info</h2>
        </div>
        <div class="finder__body">
          <p class="finder__lede">About this prototype</p>
          <p>
            A first-generation iPod, redrawn in CSS. Scroll the wheel, pick a track, and play local
            clips. More notes coming soon.
          </p>
        </div>
      </div>
    </dialog>

    <script src="/labs/ipod/app.js" defer></script>
  </body>
</html>
