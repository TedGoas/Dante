<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Receptionist voice preview</title>
  <link rel="stylesheet" href="/assets/img/dialpad/prototypes/ai-receptionist/styles.css">
</head>
<body>
  <div class="landing-preview">
    <div class="preview-box">
      <div class="phone-preview">
        <div class="transcript-area">
          <div class="transcript-inner" id="transcript"></div>
        </div>
        <div class="waveform-section">
          <div class="waveform-arc">
            <svg class="arc-svg" viewBox="0 0 560 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <mask id="arc-waveform-gap">
                  <rect width="560" height="200" fill="white"></rect>
                  <rect x="240" y="0" width="80" height="85" fill="black"></rect>
                </mask>
              </defs>
              <circle cx="280" cy="390" r="340" stroke="currentColor" stroke-width="3" stroke-dasharray="0.01 9" stroke-linecap="round" fill="none" mask="url(#arc-waveform-gap)"></circle>
            </svg>
            <div class="waveform-bars" id="waveform" aria-hidden="true">
              <span class="wbar wbar--1"></span>
              <span class="wbar wbar--2"></span>
              <span class="wbar wbar--3"></span>
              <span class="wbar wbar--4"></span>
              <span class="wbar wbar--5"></span>
              <span class="wbar wbar--6"></span>
              <span class="wbar wbar--7"></span>
              <span class="wbar wbar--8"></span>
              <span class="wbar wbar--9"></span>
            </div>
          </div>
          <div class="mute-btn-row">
            <span class="mute-btn-wrapper is-hear-aria" id="hear-wrap">
              <button type="button" class="hear-btn" id="hear-btn">
                <span class="hear-btn__icon" aria-hidden="true">
                  <svg class="icon-volume" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" fill-rule="evenodd" d="M9.181 2.111a.5.5 0 0 1 .708 0 5.5 5.5 0 0 1 0 7.777.5.5 0 1 1-.708-.707 4.5 4.5 0 0 0 0-6.363.5.5 0 0 1 0-.707ZM5.717 2.05A.5.5 0 0 1 6 2.5v7a.5.5 0 0 1-.812.39L2.825 8H1a.5.5 0 0 1-.5-.5v-3A.5.5 0 0 1 1 4h1.825l2.363-1.89a.5.5 0 0 1 .529-.06ZM5 3.54 3.312 4.89A.5.5 0 0 1 3 5H1.5v2H3a.5.5 0 0 1 .312.11L5 8.46V3.54Zm2.417.336a.5.5 0 0 1 .707 0 3 3 0 0 1 0 4.242.5.5 0 0 1-.708-.707 2 2 0 0 0 0-2.828.5.5 0 0 1 0-.707Z" clip-rule="evenodd"/></svg>
                  <svg class="icon-mic" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" hidden><path fill="currentColor" d="M6 1.25a1.75 1.75 0 0 0-1.75 1.75v3a1.75 1.75 0 1 0 3.5 0v-3A1.75 1.75 0 0 0 6 1.25ZM3.5 5.5a.5.5 0 0 0-1 0 3.5 3.5 0 0 0 3 3.464V10H4.75a.5.5 0 0 0 0 1h2.5a.5.5 0 0 0 0-1H6.5V8.964A3.5 3.5 0 0 0 9.5 5.5a.5.5 0 0 0-1 0 2.5 2.5 0 1 1-5 0Z"/></svg>
                  <svg class="icon-mic-off" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" hidden><path fill="currentColor" fill-rule="evenodd" d="M3.22 2.22a.75.75 0 0 1 1.06 0l5.5 5.5a.75.75 0 1 1-1.06 1.06l-.48-.48A3.49 3.49 0 0 1 6.5 8.96V10h1.25a.5.5 0 0 1 0 1h-3.5a.5.5 0 0 1 0-1H5.5V8.96A3.5 3.5 0 0 1 2.5 5.5a.5.5 0 0 1 1 0c0 .9.48 1.69 1.2 2.13L3.22 6.15A1.74 1.74 0 0 1 2.75 5V3.81L2.16 3.22a.75.75 0 0 1 1.06-1Zm2.53.53A.75.75 0 0 0 4.25 3.5v1.19l1.5 1.5V3.5c0-.2.16-.37.35-.4.1-.02.2 0 .28.06l.37.37.75-.75-.37-.37a1.75 1.75 0 0 0-1.38-.66Z" clip-rule="evenodd"/></svg>
                </span>
                <span class="hear-btn__label" id="hear-label">Hear Ashley</span>
              </button>
            </span>
          </div>
          <div class="preview-callbar">
            <div class="callbar-user">
              <div class="avatar avatar--aria" aria-hidden="true"><span>A</span></div>
              <div class="callbar-info">
                <div class="callbar-name-row"><span class="callbar-name">Ashley</span></div>
                <div class="callbar-meta-row">
                  <span class="callbar-phone">(919) 123-4567</span>
                  <span class="callbar-dot"></span>
                  <span class="callbar-timer" id="timer">0:00</span>
                  <span class="callbar-nqi" aria-hidden="true">
                    <span class="nqi-bar nqi-bar--1"></span>
                    <span class="nqi-bar nqi-bar--2"></span>
                    <span class="nqi-bar nqi-bar--3"></span>
                  </span>
                </div>
              </div>
            </div>
            <button type="button" class="callbar-end" tabindex="-1" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17.375 14.8517C18.3228 13.4262 18.875 11.7151 18.875 9.875C18.875 4.90444 14.8456 0.875 9.875 0.875C4.90444 0.875 0.875 4.90444 0.875 9.875C0.875 14.8456 4.90444 18.875 9.875 18.875H18.875" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              End
            </button>
          </div>
        </div>
        <div class="preview-controls">
          <button type="button" class="control-btn" id="phase-btn">
            <svg class="control-btn__pause-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2.5 2.375c0-.483.392-.875.875-.875h.25c.483 0 .875.392.875.875v7.25a.875.875 0 0 1-.875.875h-.25a.875.875 0 0 1-.875-.875v-7.25Zm5 0c0-.483.392-.875.875-.875h.25c.483 0 .875.392.875.875v7.25a.875.875 0 0 1-.875.875h-.25a.875.875 0 0 1-.875-.875v-7.25Z" fill="currentColor"/></svg>
            <span id="phase-label">Pause</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="/assets/img/dialpad/prototypes/ai-receptionist/demo.js"></script>
</body>
</html>
