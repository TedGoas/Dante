<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialpad AnalyticsGPT thumb</title>
  <link rel="stylesheet" href="/assets/img/dialpad-team/prototypes/analyticsgpt-thumb/styles.css">
</head>
<body>
  <div class="agt" id="app" aria-hidden="true" data-view="composer">
    <div class="agt__composer-view" id="composer-view">
      <div class="agt__brand">
        <span class="agt__mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="23.5" fill="url(#agt-mark-grad)" stroke="rgba(0,0,0,0.1)"/>
            <path fill="#fff" d="M25.5 16.5c.5.4 1 .9 1.5 1.4 4.2 4.2 6.1 9.1 4 11.2-1.2 1.2-3.4 1.1-5.9-.2a.75.75 0 0 1 .7-1.3c2.1 1 3.8 1.1 4.5.4 1.4-1.4-.3-5.7-4-9.4-.5-.5-.9-.9-1.4-1.3a.75.75 0 1 1 1-1.1zm2.8 6.2a.75.75 0 0 1-.1 1.1c-.4.5-.9 1-1.4 1.5-4.2 4.2-9.1 6.1-11.2 4-1.2-1.2-1.1-3.4.2-5.9a.75.75 0 1 1 1.3.7c-1 2.1-1.1 3.8-.4 4.5 1.4 1.4 5.7-.3 9.4-4 .5-.5.9-.9 1.3-1.4a.75.75 0 0 1 1.1.1zM21.3 14a.75.75 0 0 1 .3 1c-.1.3-.5.4-.8.3-2.1-1-3.8-1.1-4.5-.4-1.4 1.4.3 5.7 4 9.4.5.5.9.9 1.4 1.3a.75.75 0 1 1-1 1.1c-.5-.4-1-.9-1.5-1.4-4.2-4.2-6.1-9.1-4-11.2 1.2-1.2 3.4-1.1 5.9.2.1 0 .2.1.2.1zm1.7 5.3.3 1.1c0 .2.2.3.4.4l.9.3a.4.4 0 0 1-.1.7l-.9.2a.55.55 0 0 0-.4.4l-.3 1.2a.4.4 0 0 1-.8 0l-.3-1.2a.55.55 0 0 0-.4-.4l-.9-.2a.4.4 0 0 1 .1-.7l.9-.3a.55.55 0 0 0 .4-.4l.3-1.1a.4.4 0 0 1 .8 0zM31.6 14c1.2 1.2 1.1 3.4-.2 5.9a.75.75 0 1 1-1.3-.7c1-2.1 1.1-3.8.4-4.5-1.4-1.4-5.7.3-9.4 4-.5.5-.9.9-1.3 1.4a.75.75 0 1 1-1.1-1c.4-.5.9-1 1.4-1.5 4.2-4.2 9.1-6.1 11.2-4.1.1 0 .2.1.3.1z"/>
            <defs>
              <linearGradient id="agt-mark-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#471571"/>
                <stop offset="0.15" stop-color="#7C229E"/>
                <stop offset="0.36" stop-color="#B02290"/>
                <stop offset="0.6" stop-color="#E92F6F"/>
                <stop offset="0.9" stop-color="#FB7328"/>
                <stop offset="1" stop-color="#F3960F"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <p class="agt__title">AnalyticsGPT</p>
      </div>

      <div class="agt__composer" id="composer">
        <div class="agt__composer-field">
          <span class="agt__composer-text" id="composer-text"></span>
          <span class="agt__composer-placeholder" id="composer-placeholder">Ask me any Analytics questions</span>
          <span class="agt__caret" id="caret" hidden></span>
        </div>
        <div class="agt__composer-bar">
          <button type="button" class="agt__send" id="send-btn" aria-label="Send" tabindex="-1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h12M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="agt__thinking" id="thinking" hidden>
        <span class="agt__thinking-dot"></span>
        <span class="agt__thinking-dot"></span>
        <span class="agt__thinking-dot"></span>
        <span class="agt__thinking-label">Thinking</span>
      </div>
    </div>

    <div class="agt__answer-view" id="answer-view" hidden>
      <p class="agt__answer-copy" id="answer-copy">
        Your average CSAT is <strong>4.7</strong>, up from 4.5 last week.
      </p>

      <div class="agt__chart">
        <div class="agt__chart-head">
          <p class="agt__chart-label">Ai CSAT</p>
          <p class="agt__chart-value" id="chart-value">4.7</p>
        </div>
        <div class="agt__plot">
          <svg class="agt__line-svg" viewBox="0 0 240 110" width="240" height="110" preserveAspectRatio="none">
            <defs>
              <linearGradient id="agt-line-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#602DFF" stop-opacity="0.28"></stop>
                <stop offset="100%" stop-color="#602DFF" stop-opacity="0"></stop>
              </linearGradient>
              <clipPath id="agt-line-clip">
                <rect class="agt__line-clip-rect" x="0" y="0" width="0" height="110"></rect>
              </clipPath>
            </defs>
            <g clip-path="url(#agt-line-clip)">
              <path
                class="agt__line-area"
                d="M0 72 L60 58 L120 42 L180 28 L240 36 L240 110 L0 110 Z"
                fill="url(#agt-line-fill)"
              ></path>
              <path
                class="agt__line-path"
                d="M0 72 L60 58 L120 42 L180 28 L240 36"
                fill="none"
                stroke="#602DFF"
                stroke-width="2.25"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </g>
          </svg>
          <div
            class="agt__plot-hit"
            id="chart-hit"
            role="slider"
            tabindex="0"
            aria-label="CSAT over time"
            aria-valuemin="0"
            aria-valuemax="4"
            aria-valuenow="0"
            aria-valuetext=""
          ></div>
          <div class="agt__hover" id="chart-hover" aria-hidden="true">
            <span class="agt__hover-rule" aria-hidden="true"></span>
            <span class="agt__hover-marker" aria-hidden="true"></span>
            <div class="agt__tooltip">
              <p class="agt__tooltip-label" id="tip-date"></p>
              <p class="agt__tooltip-value" id="tip-value"></p>
            </div>
          </div>
        </div>
        <div class="agt__x-axis" aria-hidden="true">
          <span>Mon</span>
          <span>Wed</span>
          <span>Fri</span>
        </div>
      </div>
    </div>
  </div>
  <script src="/assets/img/dialpad-team/prototypes/analyticsgpt-thumb/demo.js"></script>
</body>
</html>
