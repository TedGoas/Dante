[build]
    publish = "dist"
    command = "npm run build"

# Prerender extension (Netlify UI) requires Node 20+; default image may use 18.
[build.environment]
    NODE_VERSION = "20"

[[redirects]]
  from = "/values"
  to = "/how-i-think/"
  status = 301

[[redirects]]
  from = "/values/"
  to = "/how-i-think/"
  status = 301

[[redirects]]
  from = "/assets/files/humans.txt"
  to = "/humans.txt"
  status = 301

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

